  <line x1="274" y1="220" x2="366" y2="220" stroke="#f97316" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <line x1="243" y1="207" x2="181" y2="145" stroke="#f97316" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
